name: daily

on:
  schedule:
    - cron: "30 13 * * 1-5"   # 19:00 IST, after NSE publishes bhavcopy (~18:15 IST)
  workflow_dispatch:          # manual run button

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: self-checks
        run: |
          python3 scan.py --selfcheck
          python3 build.py --selfcheck

      - name: prices + indicators
        run: python3 scan.py --back 400

      - name: homepage data
        run: python3 build.py

      - name: commit
        run: |
          git config user.name  github-actions
          git config user.email github-actions@github.com
          git add raw data
          git diff --cached --quiet || git commit -m "daily $(date -u +%F)"
          git push

      # The Pages project is direct-upload, not Git-connected, so pushing to
      # GitHub alone does NOT refresh the site - this step is what makes it live.
      - name: bundle site
        run: |
          mkdir -p dist
          cp -r *.html *.css app.js articles.json content.json img data dist/

      - name: deploy to cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=tejii --branch=main --commit-dirty=true
